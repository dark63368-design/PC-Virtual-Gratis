name: RDP_TEMPO_MAXIMO_FIXED

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Forçar Expansão de Memória Virtual (PowerShell Fix)
        run: |
          # Novo método usando PowerShell Nativo para gerenciar o PageFile sem usar o WMIC antigo
          $ComputerSystem = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -CimInstance $ComputerSystem -Property @{AutomaticManagedPagefile=$False}
          
          # Define o tamanho inicial em 32GB e máximo em 40GB usando a API do sistema
          $PageFile = Get-CimInstance -ClassName Win32_PageFileSetting | Where-Object {$_.Name -like "C:*"}
          if ($PageFile) {
              Set-CimInstance -CimInstance $PageFile -Property @{InitialSize=32768; MaximumSize=40960}
          } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=32768; MaximumSize=40960} -ErrorAction SilentlyContinue
          }
          Write-Host "Super Memória Virtual configurada com sucesso via CIM/PowerShell!"

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale-TCP" deltype=notexact
          netsh advfirewall firewall delete rule name="RDP-Tailscale-UDP" deltype=notexact
          netsh advfirewall firewall add rule name="RDP-Tailscale-TCP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389

          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Otimizar Gráficos por Software e Latência no Celular
        run: |
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "bUseHardwareGraphicsAdapter" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "TurnOnContinuousUpdates" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MinEncryptionLevel" -Value 1 -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..46)
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              Start-Sleep -Seconds 5
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              $retries++
          }
          
          if (-not $tsIP) { exit 1 }
          $cleanIP = $tsIP.Trim()
          echo "TAILSCALE_IP=$cleanIP" >> $env:GITHUB_ENV

      - name: Maintain Connection (Anti-Inatividade)
        run: |
          Write-Host "`n=== ACESSO LIBERADO POR 6 HORAS ==="
          Write-Host "IP / PC Name: $env:TAILSCALE_IP"
          Write-Host "User / Usuário: RDP"
          Write-Host "Password / Senha: $env:RDP_PASS"
          Write-Host "====================================`n"
          
          $tempoDecorrido = 0
          while ($tempoDecorrido -lt 360) {
              Write-Host "[$(Get-Date)] PC Virtual Ativo. Tempo restante: $(360 - $tempoDecorrido) minutos."
              Start-Sleep -Seconds 180
              $tempoDecorrido += 3
          }
          
