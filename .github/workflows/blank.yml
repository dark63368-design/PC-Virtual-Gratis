name: RDP_TEMPO_MAXIMO_TAILSCALE_FIX

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Otimizar Gerenciamento de Memória para o Studio
        run: |
          $ComputerSystem = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -CimInstance $ComputerSystem -Property @{AutomaticManagedPagefile=$True}
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 24 -Force
          Write-Host "Memória otimizada para o Roblox Studio!"

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale-TCP" deltype=notexact
          netsh advfirewall firewall delete rule name="RDP-Tailscale-UDP" deltype=notexact
          netsh advfirewall firewall add rule name="RDP-Tailscale-TCP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389

          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Otimizar Gráficos por Software e Latência no Celular
        run: |
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "bUseHardwareGraphicsAdapter" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "TurnOnContinuousUpdates" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MinEncryptionLevel" -Value 1 -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..46)
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale via Chocolatey
        run: |
          # Instala o Tailscale de forma limpa usando o gerenciador nativo do GitHub Actions
          choco install tailscale -y --no-progress
          
          # Atualiza as variáveis de ambiente na sessão atual para o Windows achar o comando imediatamente
          $env:Path += ";C:\Program Files\Tailscale"
          
          # Pequena pausa para garantir que o serviço do Tailscale iniciou no Windows
          Start-Sleep -Seconds 5

      - name: Establish Tailscale Connection
        run: |
          # Executa o comando atualizando o PATH local para garantir que não dê erro de arquivo não encontrado
          $env:Path += ";C:\Program Files\Tailscale"
          
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              Start-Sleep -Seconds 5
              $tsIP = tailscale ip -4
              $retries++
          }
          
          if (-not $tsIP) { exit 1 }
          $cleanIP = $tsIP.Trim()
          echo "TAILSCALE_IP=$cleanIP" >> $env:GITHUB_ENV

      - name: Maintain Connection (Anti-Inatividade)
        run: |
          Write-Host "`n=== ACESSO LIBERADO POR 6 HORAS ==="
          Write-Host "IP / PC Name: $env:TAILSCALE_IP"
          Write-Host "User / Usuário: RDP"
          Write-Host "Password / Senha: $env:RDP_PASS"
          Write-Host "====================================`n"
          
          $tempoDecorrido = 0
          while ($tempoDecorrido -lt 360) {
              Write-Host "[$(Get-Date)] PC Virtual Ativo. Tempo restante: $(360 - $tempoDecorrido) minutos."
              Start-Sleep -Seconds 180
              $tempoDecorrido += 3
          }
          
