name: RDP_TEMPO_MAXIMO_CORRIGIDO

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    # 360 minutos = 6 horas (O limite máximo absoluto que o GitHub permite de graça)
    timeout-minutes: 360

    steps:
      - name: Otimizar Gerenciamento de Memória para o Studio
        run: |
          # Garante que o Windows gerencie o PageFile dinamicamente para não estourar o limite de espaço do disco do GitHub
          $ComputerSystem = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -CimInstance $ComputerSystem -Property @{AutomaticManagedPagefile=$True}
          
          # Ajusta a prioridade do processador e memória para dar desempenho máximo a serviços e renderização em segundo plano (RDP)
          # Valor 24 altera o foco do Windows Server de "aplicativos de desktop comuns" para "serviços de alto desempenho"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 24 -Force
          
          Write-Host "Configuração de memória otimizada e protegida contra falta de espaço!"

      - name: Configure Core RDP Settings
        run: |
          # Ativa o RDP e desativa o bloqueio NLA para conexões mobile
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Abre as portas de comunicação rápida para o Windows App do celular
          netsh advfirewall firewall delete rule name="RDP-Tailscale-TCP" deltype=notexact
          netsh advfirewall firewall delete rule name="RDP-Tailscale-UDP" deltype=notexact
          netsh advfirewall firewall add rule name="RDP-Tailscale-TCP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389

          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Otimizar Gráficos por Software e Latência no Celular
        run: |
          # Força o Windows a rodar aceleração via processador (WARP) de forma estável
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "bUseHardwareGraphicsAdapter" -Value 0 -Force
          # Melhora a taxa de atualização de imagem enviada para o aplicativo Windows App do Poco X6
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name "TurnOnContinuousUpdates" -Value 1 -Force
          # Ativa compressão de dados para a imagem carregar mais rápido na sua internet
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MinEncryptionLevel" -Value 1 -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..46)
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              Start-Sleep -Seconds 5
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              $retries++
          }
          
          if (-not $tsIP) { exit 1 }
          $cleanIP = $tsIP.Trim()
          echo "TAILSCALE_IP=$cleanIP" >> $env:GITHUB_ENV

      - name: Maintain Connection (Anti-Inatividade)
        run: |
          Write-Host "`n=== ACESSO LIBERADO POR 6 HORAS ==="
          Write-Host "IP / PC Name: $env:TAILSCALE_IP"
          Write-Host "User / Usuário: RDP"
          Write-Host "Password / Senha: $env:RDP_PASS"
          Write-Host "====================================`n"
          
          $tempoDecorrido = 0
          while ($tempoDecorrido -lt 360) {
              Write-Host "[$(Get-Date)] PC Virtual Ativo. Tempo restante: $(360 - $tempoDecorrido) minutos."
              Start-Sleep -Seconds 180
              $tempoDecorrido += 3
          }
          
